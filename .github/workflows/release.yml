# 「J2」发布流水线
#
# 触发：
#   - 推送形如 0.0.1 或 v0.0.1 的 tag —— 构建各平台产物并创建 Release；
#   - 手动触发（workflow_dispatch）—— 只构建与上传流水线产物，不创建 Release，
#     用于在不打 tag 的情况下验证流水线本身。
#
# 版本号的唯一来源是 CMakeLists.txt 的 project(... VERSION ...)。
# 每次构建都校验它与 tag 一致：不一致就直接失败，避免产出名不符实的安装包。
#
# 本仓库的默认工作流权限是只读，因此创建 Release 的作业显式声明 contents: write。

name: Release

on:
  push:
    tags:
      # GitHub 的过滤模式是 glob（`+` 是字面量，不是"一次或多次"），
      # 所以这里用字符类 + `*`：0.0.1、0.0.10、v1.2.3 都能命中。
      - "[0-9]*.[0-9]*.[0-9]*"
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4

jobs:
  linux:
    name: Linux 构建与打包（deb / rpm / AppImage）
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config python3 \
            qt6-base-dev qt6-qpa-plugins \
            libgl1-mesa-dev libx11-dev libxrandr-dev libxkbcommon-dev \
            libdbus-1-dev zlib1g-dev \
            libwayland-dev wayland-protocols \
            rpm xvfb
          # 关键依赖是否到位：缺失时 CMake 会静默降级（少 jie2-line、
          # 少 Wayland 热键），所以这里把结论打印出来便于对照。
          pkg-config --modversion wayland-client wayland-protocols dbus-1
          wayland-scanner --version

      - name: 校验 tag 与项目版本一致
        if: github.ref_type == 'tag'
        run: |
          PROJECT_VERSION="$(grep -m1 -E '^[[:space:]]+VERSION [0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt | awk '{print $2}')"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "tag=${TAG_VERSION} 项目版本=${PROJECT_VERSION}"
          if [ "$TAG_VERSION" != "$PROJECT_VERSION" ]; then
            echo "::error::tag（${TAG_VERSION}）与 CMakeLists.txt 的项目版本（${PROJECT_VERSION}）不一致，请先统一版本号再打 tag。"
            exit 1
          fi

      - name: 配置与构建
        run: |
          cmake -S . -B build-linux -DCMAKE_BUILD_TYPE=Release
          cmake --build build-linux -j"$(nproc)"
          # 构建摘要：确认 Wayland 顶部条与门户后端确实编进来了。
          ls -l build-linux/src/ui/jie2 build-linux/src/tools/jie2-probe
          ls -l build-linux/src/tools/jie2-line || echo "（本次构建无 jie2-line）"

      - name: 运行测试
        run: ctest --test-dir build-linux --output-on-failure

      - name: 打包 deb / rpm / AppImage
        run: |
          bash scripts/build-deb.sh build-linux dist
          bash scripts/build-rpm.sh build-linux dist
          bash scripts/build-appimage.sh build-linux dist
          ls -lh dist

      - name: 上传 linux 产物
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          if-no-files-found: error
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage

  macos:
    name: macOS 构建与打包（zip / dmg）
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Qt6
        run: |
          # qtbase 是 qt 拆分后的主模块；没有该 formula 时退回完整 qt。
          brew install qtbase || brew install qt
          brew list --versions qtbase || brew list --versions qt
          command -v cmake || brew install cmake

      - name: 校验 tag 与项目版本一致
        if: github.ref_type == 'tag'
        run: |
          PROJECT_VERSION="$(grep -m1 -E '^[[:space:]]+VERSION [0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt | awk '{print $2}')"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "tag=${TAG_VERSION} 项目版本=${PROJECT_VERSION}"
          if [ "$TAG_VERSION" != "$PROJECT_VERSION" ]; then
            echo "::error::tag（${TAG_VERSION}）与 CMakeLists.txt 的项目版本（${PROJECT_VERSION}）不一致，请先统一版本号再打 tag。"
            exit 1
          fi

      - name: 配置与构建
        run: |
          QT_PREFIX="$(brew --prefix qtbase 2>/dev/null || brew --prefix qt)"
          echo "Qt 前缀：$QT_PREFIX"
          cmake -S . -B build-macos -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_PREFIX"
          cmake --build build-macos -j"$(sysctl -n hw.ncpu)"

      - name: 运行测试
        run: ctest --test-dir build-macos --output-on-failure

      - name: 自包含打包（zip + dmg）
        run: |
          export MACDEPLOYQT="$(brew --prefix qtbase 2>/dev/null || brew --prefix qt)/bin/macdeployqt"
          bash scripts/package-macos.sh build-macos dist
          ls -lh dist

      - name: 上传 macOS 产物
        uses: actions/upload-artifact@v4
        with:
          name: macos-packages
          if-no-files-found: error
          path: |
            dist/*.zip
            dist/*.dmg

  windows:
    name: Windows 构建与打包（zip）
    runs-on: windows-2022
    # 在 MSYS2 的 bash 里跑：工具链、Qt6、objdump、zip 都在同一前缀（/ucrt64）。
    # 选 MinGW 而不是 MSVC，因为 Windows 平台后端此前就是用
    # mingw-w64 + UCRT 交叉编译验证过的（见 scripts/verify-windows-cross.sh），
    # 这里沿用同一套工具链，避免"验证过的代码换个编译器重新赌一次"。
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: 准备 MSYS2 与 Qt6 工具链
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          # 不整体 update：镜像里的包库已足够新，跳过可省两三分钟。
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            zip
            unzip

      - name: 校验 tag 与项目版本一致
        if: github.ref_type == 'tag'
        run: |
          PROJECT_VERSION="$(grep -m1 -E '^[[:space:]]+VERSION [0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt | awk '{print $2}')"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "tag=${TAG_VERSION} 项目版本=${PROJECT_VERSION}"
          if [ "$TAG_VERSION" != "$PROJECT_VERSION" ]; then
            echo "::error::tag（${TAG_VERSION}）与 CMakeLists.txt 的项目版本（${PROJECT_VERSION}）不一致，请先统一版本号再打 tag。"
            exit 1
          fi

      - name: 配置与构建
        run: |
          # cygpath 把 /ucrt64 转成 Windows 路径：CMake 是原生程序，
          # 直接给 POSIX 路径在部分 MSYS2 版本上会被当成相对路径。
          cmake -S . -B build-windows -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(cygpath -m /ucrt64)"
          cmake --build build-windows
          ls -l build-windows/src/ui/jie2.exe build-windows/src/tools/jie2-probe.exe

      - name: 运行测试
        run: ctest --test-dir build-windows --output-on-failure

      - name: 平台能力自检（运行级，本机 Win32 后端）
        # 这是 Windows 后端第一次在真实 Windows 上跑（此前只有交叉编译）。
        # 不阻断发布：runner 的桌面会话与真实机器不同，抓屏/枚举失败
        # 属于环境差异，结论以日志为准，由发布说明如实记录。
        continue-on-error: true
        run: |
          ./build-windows/src/tools/jie2-probe.exe
          echo "== --displays =="
          ./build-windows/src/tools/jie2-probe.exe --displays
          echo "== --capture =="
          ./build-windows/src/tools/jie2-probe.exe --capture
          echo "== --windows =="
          ./build-windows/src/tools/jie2-probe.exe --windows

      - name: 自包含打包（zip）
        run: |
          bash scripts/package-windows.sh build-windows dist
          ls -lh dist

      - name: 解压并在隔离搜索路径下启动成品
        shell: pwsh
        run: |
          $archive = Get-ChildItem dist/*-windows-x64.zip | Select-Object -First 1
          Expand-Archive $archive.FullName -DestinationPath windows-package-check
          $exe = Get-ChildItem windows-package-check -Recurse -Filter jie2.exe | Select-Object -First 1
          # 排除开发环境的 Qt / MinGW，强制从成品目录与系统目录加载依赖。
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          Remove-Item Env:QT_PLUGIN_PATH -ErrorAction SilentlyContinue
          Remove-Item Env:QT_QPA_PLATFORM_PLUGIN_PATH -ErrorAction SilentlyContinue
          Remove-Item Env:QT_QPA_PLATFORM -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath $exe.FullName -ArgumentList '--self-check' -PassThru -WorkingDirectory $exe.DirectoryName -RedirectStandardOutput package-check.log -RedirectStandardError package-check-error.log
          if (-not $process.WaitForExit(30000)) { $process.Kill(); throw '成品启动超时' }
          Get-Content package-check.log, package-check-error.log
          if ($process.ExitCode -ne 0) { throw "成品启动失败：$($process.ExitCode)" }
          if (-not (Select-String -Path package-check.log -Pattern 'self-check passed' -Quiet)) { throw '缺少启动成功确认' }

      - name: 上传 Windows 产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          if-no-files-found: error
          path: dist/*.zip

  release:
    name: 创建或补全 Release
    needs: [linux, macos, windows]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: 取回各平台产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 列出待发布文件
        run: ls -lh artifacts

      - name: 创建 Release 或补全附件
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 幂等：同一个 tag 可能因为新增平台、重跑流水线而再次进入这里。
          # 已有 Release 时只上传（覆盖同名）附件，**不覆盖**发布说明 ——
          # 说明里写了安装方法与已验证范围，是人工维护的。
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME 已存在，补全附件"
            gh release upload "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber \
              artifacts/*
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "J2 $GITHUB_REF_NAME" \
              --generate-notes \
              artifacts/*
          fi
